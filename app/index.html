<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cap Invest — Version de test</title>
<meta name="description" content="Des parcours courts et ludiques pour comprendre l'investissement et la finance personnelle. Contenu éducatif, sans compte.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF5EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A2E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cap Invest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icones/icone-192.png">
<link rel="apple-touch-icon" href="../icones/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --papier:#FBF5EA; --carte:#FFFFFF; --encre:#1E2440; --encre-douce:#5B6080;
    --corail:#FF6A4D; --moutarde:#F4B42A; --canard:#14808A; --canard-clair:#D8F0EE;
    --rose-clair:#FFE4DC; --trait:#E7DCCB; --ombre:0 3px 0 var(--encre);
    --rouge:#B33A22; --jaune-clair:#FFF6DC; --rose-pale:#FFF1EC; --bientot:#F3EDE2; --sur-couleur:#1E2440;
    --rayon:18px;
  }
  /* Thème sombre : nuit bleu marine, contours crème, couleurs vives conservées */
  @media (prefers-color-scheme: dark){
    :root{
      --papier:#141A2E; --carte:#1F2741; --encre:#F3ECDF; --encre-douce:#AEB3CC;
      --canard:#3CC4CE; --canard-clair:#123B42; --rose-clair:#3D2320; --trait:#39425F;
      --ombre:0 3px 0 #06080F; --rouge:#FF8F75; --jaune-clair:#3A3218; --rose-pale:#3A2320; --bientot:#192036;
    }
    .bouton{box-shadow:0 3px 0 #06080F}
    /* Texte foncé sur les aplats jaune moutarde */
    .test,.perso[aria-pressed="true"],.perso[aria-pressed="true"] b,.perso[aria-pressed="true"] span,.option .num,.etape .etat.neuf,.idee-entree .etat{color:var(--sur-couleur)}
    .perso[aria-pressed="true"]{border-color:var(--moutarde)}
    svg.mona,svg.habitant,.perso svg,.salut svg,.popup-carte svg,.souvenir svg,.souvenir-gagne svg,.coffre-svg,.lot-apercu svg{filter:drop-shadow(0 0 1.5px rgba(243,236,223,.55))}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--papier);color:var(--encre)}
  body{font:17px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  h1,h2,.titre{font-family:Fraunces,Georgia,serif;font-weight:800;letter-spacing:-.01em;margin:0}
  button{font:inherit;color:inherit;cursor:pointer}
  .page{width:100%;max-width:480px;margin:0 auto;padding:12px 16px 16px;flex:1;display:flex;flex-direction:column}

  /* En-tête */
  header{display:flex;align-items:center;gap:10px;min-height:40px}
  .test{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--moutarde);color:var(--encre);padding:4px 9px;border-radius:999px;border:2px solid var(--encre);white-space:nowrap}
  .retour-carte{border:2px solid var(--encre);background:var(--carte);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;font-size:20px;line-height:1;flex:none}
  .progression{flex:1;height:14px;border:2px solid var(--encre);border-radius:999px;background:var(--carte);overflow:hidden}
  .progression i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--canard) 0 10px,#1A929D 10px 20px);transition:width .4s ease}
  .points{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .serie{font-size:13px;font-weight:700;color:var(--corail);min-height:20px;text-align:right}
  .espace{flex:1}

  /* Cartes et boutons */
  .carte{background:var(--carte);border:2px solid var(--encre);border-radius:var(--rayon);box-shadow:var(--ombre);padding:16px}
  .bouton{display:block;width:100%;padding:15px 18px;border:2px solid var(--encre);border-radius:14px;background:var(--encre);color:var(--papier);font-weight:700;font-size:18px;box-shadow:0 3px 0 #000;transition:transform .08s}
  .bouton:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
  .bouton:disabled{opacity:.35;cursor:not-allowed}
  .bouton.clair{background:var(--carte);color:var(--encre);box-shadow:var(--ombre)}
  .option{display:block;width:100%;text-align:left;padding:14px 16px;margin:0 0 10px;border:2px solid var(--encre);border-radius:14px;background:var(--carte);box-shadow:var(--ombre);font-size:17px;transition:transform .08s,background .2s}
  .option:active{transform:translateY(2px);box-shadow:0 1px 0 var(--encre)}
  .option.juste{background:var(--canard-clair);border-color:var(--canard)}
  .option.faux{background:var(--rose-clair);border-color:var(--corail)}
  .option[disabled]{cursor:default}
  .option.manque{opacity:.55;box-shadow:none}
  .option .num{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:10px;border-radius:50%;background:var(--moutarde);border:2px solid var(--encre);font-weight:700;font-size:14px;vertical-align:middle}
  .option .num:empty{background:var(--papier)}
  .indice{margin:-4px 0 14px;font-size:15px}
  .indice summary{display:inline-block;cursor:pointer;font-weight:700;color:var(--canard);text-decoration:underline;list-style:none}
  .indice summary::-webkit-details-marker{display:none}
  .indice p{margin:8px 0 0;padding:10px 12px;background:var(--jaune-clair);border:2px solid var(--moutarde);border-radius:12px}
  .option .ton-rang{display:block;margin:4px 0 0 36px;font-size:13px;font-weight:700;color:var(--rouge)}
  .grille{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grille .option{margin:0;text-align:center;min-height:76px;display:grid;place-items:center;font-weight:700}

  /* Accueil */
  .accueil h1{font-size:34px;line-height:1.05;margin:18px 0 6px}
  .accueil p.chapo{color:var(--encre-douce);margin:0 0 18px}
  .persos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .perso{text-align:left;padding:14px 12px;border:2px solid var(--encre);border-radius:var(--rayon);background:var(--carte);box-shadow:var(--ombre);display:flex;flex-direction:column;gap:6px;min-height:170px}
  .perso[aria-pressed="true"]{background:var(--moutarde)}
  .perso svg{width:54px;height:54px}
  .perso b{font-family:Fraunces,serif;font-size:20px}
  .perso span{font-size:14px;color:var(--encre-douce);line-height:1.3}
  .perso[aria-pressed="true"] span{color:var(--encre)}
  .note{font-size:13px;color:var(--encre-douce);margin:12px 0}
  .pseudo{display:block;margin:4px 0 12px;box-shadow:none}
  .pseudo span{color:var(--encre-douce);font-size:14px}
  .pseudo input{display:block;width:100%;margin:8px 0 6px;padding:12px;font:inherit;border:2px solid var(--encre);border-radius:12px;background:var(--papier);color:var(--encre)}
  .pseudo small{display:block;font-size:12px;color:var(--encre-douce)}

  .tableau-perso{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 10px}
  .stat-jour{padding:10px 12px;box-shadow:none}
  .stat-jour b{display:block;font-family:Fraunces,serif;font-size:22px}
  .stat-jour span{font-size:13px;color:var(--encre-douce)}
  .stat-jour.atteint{background:var(--canard-clair);border-color:var(--canard)}
  .semaine{display:flex;gap:5px}
  .semaine .jour{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--trait);font-size:11px;font-weight:700;color:var(--encre-douce);font-style:normal}
  .semaine .jour.fait{background:var(--jaune-clair);border-color:var(--moutarde);font-size:13px}
  .semaine .jour.repos{border-style:dashed;font-size:12px}
  .semaine .jour.auj{border-color:var(--canard);border-style:dashed;color:var(--canard)}
  .actions-jour{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .actions-jour.seule{grid-template-columns:1fr}
  .tuile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 12px;width:100%}
  .tuile b{font-family:Fraunces,serif;font-size:17px}
  .tuile span{font-size:13px;color:var(--encre-douce)}
  .tuile.repas{background:var(--jaune-clair);border-color:var(--moutarde)}
  .tuile.revision{background:var(--rose-clair);border-color:var(--corail);margin:0}
  .tuile.fait{box-shadow:none}
  .tuile.chapitre{grid-column:1/-1;background:var(--canard-clair);border-color:var(--canard)}
  .histoire .saison{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--canard);margin:14px 0 4px}
  .histoire h1{font-size:28px;margin:0 0 10px}
  .histoire > p{font-size:17px;line-height:1.45}
  .histoire > p.note{font-size:14px;line-height:1.4;color:var(--encre-douce)}
  .histoire .bulle-mona{margin:14px 0 18px}
  .issue{position:relative;padding:12px 14px;margin:0 0 10px;box-shadow:none}
  .issue.prise{border-color:var(--canard);border-width:3px;background:var(--canard-clair)}
  .issue b{display:block;font-family:Fraunces,serif;font-size:18px;margin-bottom:4px}
  .issue .chiffre{margin:2px 0;font-weight:700;font-size:16px}
  .issue .detail{margin:6px 0 0;font-size:14px;color:var(--encre-douce)}
  .badge-choix{position:absolute;top:-10px;right:12px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--canard);color:var(--carte)}
  .histoire .src{font-size:13px;margin:4px 0 14px}
  .histoire .src a{color:var(--canard)}
  .histoire .bouton + .bouton{margin-top:12px}
  .popup{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(20,26,46,.55);animation:monte .2s ease-out}
  .popup-carte{max-width:340px;width:100%;text-align:center;padding:22px 20px 20px}
  .popup-carte svg{width:150px;height:150px;animation:tourne .5s cubic-bezier(.3,1.6,.5,1)}
  .popup-carte h2{margin:6px 0 4px}
  .popup-carte p{margin:0 0 16px;color:var(--encre-douce)}
  .badges-ligne{padding:10px 12px;margin-bottom:12px;box-shadow:none}
  .badges-titre{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
  .badges-liste{display:flex;gap:8px;flex-wrap:wrap}
  .mini-badge .pastille{border:2px solid var(--encre);border-radius:50%;display:grid;place-items:center}
  .mini-badge.verrou{filter:grayscale(1);opacity:.3}
  .objectif{display:flex;flex-direction:column;gap:2px;margin:6px 0 4px;background:var(--canard-clair);border-color:var(--canard);box-shadow:none}
  .objectif.discret{background:var(--carte);border-color:var(--trait)}
  .objectif span{font-size:14px;color:var(--encre-douce)}
  .objectif.avec-mona{flex-direction:row;align-items:center;gap:12px}
  .objectif.avec-mona svg{flex:none}
  .objectif.avec-mona div{display:flex;flex-direction:column;gap:2px}
  .badge-gagne{display:grid;place-items:center;margin:16px 0 4px;animation:tourne .8s ease}
  .badge-gagne .pastille{border:4px solid var(--encre);border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 0 var(--encre)}
  /* Carte des parcours */
  .salut{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
  .salut svg{width:46px;height:46px;flex:none}
  .salut h1{font-size:26px;line-height:1.1}
  .total{color:var(--encre-douce);font-size:14px;margin:0 0 14px}
  .chemin{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:4px}
  .chemin::before{content:"";position:absolute;left:35px;top:30px;bottom:30px;border-left:4px dotted var(--trait)}
  .section-carte{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--encre-douce);margin:10px 0 -4px 6px;position:relative;background:var(--papier);align-self:flex-start;padding-right:8px}
  .etape{position:relative;display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:12px 14px 12px 10px;border:2px solid var(--encre);border-radius:var(--rayon);background:var(--carte);box-shadow:var(--ombre)}
  .etape:active{transform:translateY(2px);box-shadow:0 1px 0 var(--encre)}
  .etape .pastille{flex:none;width:54px;height:54px;border-radius:50%;border:2.5px solid var(--encre);display:grid;place-items:center;position:relative}
  .etape .pastille svg{width:30px;height:30px}
  .etape b{font-family:Fraunces,serif;font-size:19px;line-height:1.15;display:block}
  .etape small{display:block;font-size:14px;color:var(--encre-douce);line-height:1.3;margin-top:2px}
  .etape .etat{margin-left:auto;flex:none;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px;border:1.5px solid var(--encre)}
  .etape.bientot{background:var(--bientot);box-shadow:none;border-style:dashed}
  .etape.bientot .pastille{filter:grayscale(1);opacity:.55}
  .etape.bientot .etat{background:var(--papier);color:var(--encre-douce);border-color:var(--encre-douce)}
  .etape .etat.fait{background:var(--canard-clair);color:var(--canard);border-color:var(--canard)}
  .etape .etat.neuf{background:var(--moutarde)}
  .bulle{margin-top:6px;font-size:13px;font-weight:700;color:var(--canard)}
  .installer{margin-top:18px;font-size:14px;background:var(--canard-clair);border-color:var(--canard)}
  .installer b{font-family:Fraunces,serif;font-size:17px}
  .installer p{margin:4px 0 10px}
  .installer .bouton{font-size:16px;padding:11px}

  /* Exercice */
  .etiquette{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:var(--canard-clair);color:var(--canard);border:1.5px solid var(--canard);margin:14px 0 8px}
  .etiquette.arnaque{background:var(--rose-clair);color:var(--rouge);border-color:var(--corail)}
  .question{font-size:25px;line-height:1.18;margin:0 0 18px}
  .zone{flex:1}
  .ligne-boutons{display:flex;gap:10px}
  .ligne-boutons .bouton{flex:1}

  /* Retour */
  .retour{margin-top:14px;animation:monte .3s ease}
  .retour.juste{background:var(--canard-clair);border-color:var(--canard)}
  .retour.faux{background:var(--rose-pale);border-color:var(--corail)}
  .retour h2{font-size:22px;margin-bottom:6px}
  .retour .gain{font-weight:700;color:var(--canard)}
  .retour p{margin:6px 0}
  details{margin:10px 0 14px;border-top:1.5px dashed var(--trait);padding-top:10px}
  summary{font-weight:700;cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"+ ";color:var(--corail)}
  details[open] summary::before{content:"− "}
  details p{font-size:15px}
  details a{color:var(--canard);font-size:14px;word-break:break-word}
  .secoue{animation:secoue .35s}
  @keyframes monte{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes secoue{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

  /* Confettis */
  .confettis{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
  .confettis i{position:absolute;top:38%;left:50%;width:10px;height:14px;border:2px solid var(--encre);border-radius:3px;animation:vole .9s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes vole{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

  /* Cours */
  .bulle-mona{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
  .bulle-mona p{position:relative;margin:0;background:var(--carte);border:2px solid var(--encre);border-radius:16px;padding:10px 12px;font-size:15px;line-height:1.35}
  .bulle-mona p::before{content:"";position:absolute;left:-9px;top:22px;border:8px solid transparent;border-right-color:var(--encre);border-left:0}
  .bulle-mona .mona{flex:none}
  .cours-carte{position:relative}
  .mona-coin{position:absolute;top:-22px;right:8px}
  /* Terrier de Mona */
  .repas-jour{padding:12px;margin:4px 0 14px;box-shadow:none}
  .repas-haut{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .repas-haut svg.mona{flex:none}
  .repas-haut b{display:block;font-family:Fraunces,serif;font-size:19px}
  .repas-haut span{font-size:13px;color:var(--encre-douce)}
  .repas-jour .semaine{justify-content:space-between;margin-bottom:12px}
  .repas-jour .semaine .jour{width:32px;height:32px;font-size:12px}
  .repas-jour .actions-jour{margin:0}
  .vers-terrier{margin-left:auto;align-self:center;border:0;background:none;padding:4px 0;font-size:13px;font-weight:700;color:var(--canard);white-space:nowrap;cursor:pointer}
  .compte-souvenirs{font-family:inherit;font-size:14px;font-weight:700;color:var(--encre-douce);margin-left:6px}
  .etageres{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .souvenir{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--carte);border:2px solid var(--encre);border-radius:14px;padding:10px 4px 8px;text-align:center;font-size:11.5px;line-height:1.2;animation:tourne .5s ease}
  .souvenir.verrou{border-style:dashed;border-color:var(--trait);color:var(--encre-douce);animation:none}
  .souvenir.verrou i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:2px dashed var(--trait);font-style:normal;font-weight:800;font-family:Fraunces,serif;font-size:18px}
  /* Coffres de fin de chapitre et garde-robe */
  .r-commun{--rar:#14808A} .r-rare{--rar:#2F6FD6} .r-epique{--rar:#8A4FD8} .r-legendaire{--rar:#F4B42A}
  .coffre-ecran{text-align:center}
  .coffre-ecran > p{text-align:left}
  .coffre-boite{display:block;margin:10px auto 16px;padding:0;border:0;background:none}
  .coffre-svg .c-lueur{fill:var(--rar,#F4B42A);opacity:0;transition:opacity .4s}
  .coffre-svg .c-couvercle{transform-box:view-box;transform-origin:14px 46px;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
  .coffre-boite.secoue{animation:secoue .3s 3}
  .coffre-boite.ouvert{margin-top:26px}
  .coffre-boite.ouvert .c-couvercle{transform:translate(-4px,-12px) rotate(-22deg)}
  .coffre-boite.ouvert .c-lueur{opacity:.45}
  .lot{margin:0 0 14px}
  .lot.neuf{animation:tourne .5s ease}
  .lot h2{margin:8px 0 6px;font-size:22px}
  .rarete{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--rar);color:#fff;border:2px solid #1E2440}
  .rarete.r-legendaire{color:#1E2440}
  .lot-apercu{display:flex;justify-content:center;min-height:60px;align-items:center}
  .gain-noisettes{font-family:Fraunces,serif;font-size:36px}
  .coffre-ecran .bulle-mona{text-align:left}
  .souvenir.objet{font:inherit;font-size:11.5px;color:var(--encre);border-color:var(--rar)}
  .souvenir.objet[aria-pressed="true"]{background:var(--canard-clair);box-shadow:inset 0 0 0 2px var(--rar)}
  .souvenir.objet small{font-size:10.5px;font-weight:700;color:var(--canard)}
  .tuile.coffre-tuile{background:var(--jaune-clair);border-color:var(--moutarde)}
  .souvenir-gagne{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px 0 2px;font-weight:700}
  /* Quêtes du village : intro de l'habitant, scène de fin */
  .quete{display:flex;flex-direction:column;animation:monte .3s ease}
  .quete-habitant{display:grid;place-items:center;margin:8px 0 2px}
  .quete .saison{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--canard);text-align:center}
  .quete h1{text-align:center;margin:4px 0 14px}
  .quete .note{margin:4px 0 16px}
  .bulle-mona svg.habitant{flex:none}
  .bulle-mona.droite{flex-direction:row-reverse}
  .bulle-mona.droite p::before{left:auto;right:-9px;border-right-color:transparent;border-left:8px solid var(--encre);border-right:0}
  .scene-quete{margin:14px 0 4px;text-align:left}

  /* Mona vivante : respiration, clignement, et un geste selon le moment (coupés si le téléphone demande moins d'animations) */
  svg.mona,svg.habitant{overflow:visible;transform-origin:50% 100%;animation:respire 3.2s ease-in-out infinite}
  svg.mona :is(.m-oreille,.m-yeux,.m-extra,.m-noix),svg.habitant .m-yeux{transform-box:fill-box}
  svg.mona .m-bras{transform-box:view-box}
  .m-oreille{transform-origin:50% 100%}
  .m-yeux{transform-origin:center;animation:cligne 4.6s infinite}
  .m-extra,.m-noix{transform-origin:center}
  @keyframes respire{50%{transform:scale(1.015,1.03)}}
  @keyframes cligne{0%,93%,100%{transform:none}95.5%{transform:scaleY(.1)}}
  /* Coucou à l'accueil */
  svg.mona.coucou .m-bras-g{animation:coucou 1.8s .5s ease-in-out}
  @keyframes coucou{22%{transform:rotate(185deg)}36%{transform:rotate(210deg)}50%{transform:rotate(180deg)}64%{transform:rotate(210deg)}80%{transform:rotate(185deg)}}
  /* Bonne réponse : saut, pattes en l'air */
  svg.mona.saut{animation:saut .8s cubic-bezier(.3,.7,.4,1),respire 3.2s ease-in-out .8s infinite}
  .mona.saut .m-oreille{animation:oreille .8s ease-in-out}
  .mona.saut .m-bras-g{animation:haut-g .8s ease-in-out}
  .mona.saut .m-bras-d{animation:haut-d .8s ease-in-out}
  @keyframes saut{18%{transform:scale(1.08,.9)}45%{transform:translateY(-22%) scale(.96,1.05)}72%{transform:translateY(0) scale(1.06,.94)}86%{transform:scale(.98,1.02)}}
  @keyframes oreille{30%{transform:rotate(-16deg)}50%{transform:rotate(14deg)}70%{transform:rotate(-8deg)}}
  @keyframes haut-g{25%,72%{transform:rotate(190deg)}}
  @keyframes haut-d{25%,72%{transform:rotate(-185deg)}}
  /* Mauvaise réponse : tête penchée, patte sur la joue */
  svg.mona.penche{animation:penche 1.1s ease-in-out,respire 3.2s ease-in-out 1.1s infinite}
  .mona.penche .m-bras-d{animation:gratte 1.1s ease-in-out}
  .mona.penche .m-extra{animation:question 1.1s ease-out}
  @keyframes penche{30%,70%{transform:rotate(-9deg)}}
  @keyframes gratte{20%{transform:rotate(-12deg)}35%{transform:rotate(8deg)}50%{transform:rotate(-12deg)}65%{transform:rotate(8deg)}80%{transform:none}}
  @keyframes question{0%,20%{transform:scale(0);opacity:0}45%{transform:scale(1.3);opacity:1}60%{transform:scale(1)}}
  /* Noisette du jour : Mona l'attrape (attend la fermeture de la fenêtre) */
  svg.mona.range{animation:attrape 1.6s ease-in-out,respire 3.2s ease-in-out 1.6s infinite}
  .mona.range .m-noix{animation:tombe-noix 1.6s cubic-bezier(.4,0,.3,1) forwards}
  .mona.range .m-bras-g{animation:ouvre-g 1.6s ease-in-out}
  .mona.range .m-bras-d{animation:ouvre-d 1.6s ease-in-out}
  body:has(.popup) .mona.range,body:has(.popup) .mona.range *{animation-play-state:paused}
  @keyframes tombe-noix{0%{opacity:1;transform:translateY(-90px) rotate(-40deg)}45%{opacity:1;transform:translateY(0) rotate(10deg)}55%{opacity:1;transform:translateY(-4px)}65%,100%{opacity:1;transform:none}}
  @keyframes attrape{0%,42%{transform:none}50%{transform:scale(1.07,.92)}62%{transform:scale(.98,1.03)}}
  @keyframes ouvre-g{8%,40%{transform:rotate(100deg)}55%{transform:rotate(-6deg)}70%{transform:none}}
  @keyframes ouvre-d{8%,40%{transform:rotate(-100deg)}55%{transform:rotate(8deg)}70%{transform:none}}
  /* Réveil du printemps : yeux fermés, puis Mona s'étire et bâille */
  svg.mona.reveil{animation:etire 2.2s ease-in-out,respire 3.2s ease-in-out 2.2s infinite}
  .mona.reveil .m-yeux{animation:ouvre 2.2s steps(1,end),cligne 4.6s 2.2s infinite}
  .mona.reveil .m-dort{animation:ferme 2.2s steps(1,end)}
  .mona.reveil .m-bras-g{animation:etire-g 2.2s ease-in-out}
  .mona.reveil.contente .m-bras-d{animation:etire-d 2.2s ease-in-out}
  .mona.reveil .m-bouche{animation:cache 2.2s ease-in-out}
  .mona.reveil .m-baille{animation:montre 2.2s ease-in-out}
  @keyframes etire{0%,45%{transform:none}60%{transform:scale(.95,1.1)}78%{transform:scale(1.03,.97)}}
  @keyframes ouvre{0%{opacity:0}40%{opacity:1}}
  @keyframes ferme{0%{opacity:1}40%{opacity:0}}
  @keyframes etire-g{0%,45%{transform:none}58%,74%{transform:rotate(190deg)}88%{transform:none}}
  @keyframes etire-d{0%,45%{transform:none}58%,74%{transform:rotate(-185deg)}88%{transform:none}}
  @keyframes cache{0%,50%{opacity:1}54%,72%{opacity:0}76%{opacity:1}}
  @keyframes montre{0%,50%{opacity:0}54%,72%{opacity:1}76%{opacity:0}}
  .cours-carte h2{padding-right:40px}

  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--encre);color:var(--papier);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center;animation:monte .25s ease}

  footer{max-width:480px;margin:0 auto;padding:10px 16px calc(14px + env(safe-area-inset-bottom));font-size:12px;line-height:1.4;color:var(--encre-douce);text-align:center;border-top:1.5px solid var(--trait)}

  /* Onglets Principal / Histoire */

  /* Terrier de Mona : décor animé */
  :root{--ciel:#CDEBF0;--colline:#9CCB7A;--colline-loin:#BFE0A0;--feuillage:#6FAF5A;--trou:#4A3220;--soleil:#F4B42A}
  @media (prefers-color-scheme: dark){:root{--ciel:#22305A;--colline:#2F5A3A;--colline-loin:#3A6A48;--feuillage:#3D7A45;--trou:#0D0F1A;--soleil:#F3ECDF}}
  .decor{position:relative;height:230px;margin:10px 0 12px;border:2px solid var(--encre);border-radius:var(--rayon);background:var(--ciel);overflow:hidden;box-shadow:var(--ombre)}

  @media (prefers-color-scheme: dark){.decor.ete{--ciel:#26386A}.decor.automne{--feuillage:#9A5A26;--colline:#6A5A30}.decor.hiver{--feuillage:#AFC0CC;--colline:#7D8EA0;--colline-loin:#5D6E82}}
  .paysage{position:absolute;inset:0;width:100%;height:100%}

  @keyframes plume{0%,35%{transform:none;opacity:1}100%{transform:translate(8px,40px) rotate(70deg);opacity:0}}

  @keyframes vers-cachette{to{transform:translate(var(--x),var(--y)) scale(.6);opacity:.2}}

  /* ---------- Installation sur l'écran d'accueil ---------- */
  let invite = null;

  const installee = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  function encartInstallation(){

      ${ios ? "" : `<button class="bouton clair ${invite ? "" : "cache"}" id="installer">Installer</button><p class="${invite ? "cache" : ""}" style="margin:0">Sinon : menu du navigateur ⋮ puis « Ajouter à l'écran d'accueil ».</p>`}

  function brancheInstallation(){
    const b = document.getElementById("installer");
    if (b) b.onclick = async () => { if (!invite) return; invite.prompt(); const c = await invite.userChoice; if (c && c.outcome === "accepted") evt("installation"); invite = null; b.classList.add("cache"); };
  }

  /* ---------- Progression locale : leçons, série de jours, badges, erreurs ---------- */
  const jourDe = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const auj = () => jourDe(new Date());
  const decale = (s, n) => { const d = new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return jourDe(d); };
  const veille = s => decale(s, -1);
  const lundi = s => decale(s, -((new Date(s+"T12:00:00").getDay()+6)%7));
  M.jours = M.jours || []; M.erreurs = M.erreurs || [];
  // Ancien format (parcours d'un seul tenant) : considéré comme terminé
  Object.values(M.parcours).forEach(m => { if (m.fini && !m.lecons) m.lecons = { 0:{ meilleur:m.meilleur||0 }, 1:{ meilleur:0 } }; });
  // Réserves de Mona : jours joués d'affilée. Un jour de repos par semaine (lundi-dimanche)
  // ne casse pas la série, pour ne pas punir un oubli.
  function reserves(){
    const j = new Set(M.jours), repos = new Set(); let d = auj(), n = 0;
    if (!j.has(d)) d = veille(d);
    for (;;){
      if (j.has(d)){ n++; d = veille(d); continue; }
      if (j.has(veille(d)) && ![...repos].some(r => lundi(r) === lundi(d))){ repos.add(d); d = veille(d); continue; }
      break;
    }
    return { n, repos };
  }
  const serieJours = () => reserves().n;
  // Semaine en cours : un 🍽️ par jour joué, 💤 pour le jour de repos
  function semaineRepas(){
    const { repos } = reserves(), j = new Set(M.jours), a = auj(), l = lundi(a);
    const cases = ["L","M","M","J","V","S","D"].map((nom, k) => {
      const d = decale(l, k), c = j.has(d) ? "fait" : repos.has(d) ? "repos" : d === a ? "auj" : "";
      return `<i class="jour ${c}" title="${c === "repos" ? "Jour de repos : ta série continue" : ""}">${c === "fait" ? "🍽️" : c === "repos" ? "💤" : nom}</i>`;
    }).join("");
    return `<div class="semaine" aria-label="Jours joués cette semaine. Un jour de repos par semaine ne casse pas la série.">${cases}</div>`;
  }
  // Onglet Principal : le repas du jour de Mona (remplace le défi du jour) et la révision
  function carteRepas(apres){
    const n = serieJours(), hm = humeurMona();

    return `<section class="carte repas-jour" aria-label="Repas de Mona">

  /* ---------- Le terrier de Mona : un souvenir par quête terminée ---------- */
  const SOUVENIRS = (() => {

    };

  const souvenir = (id, t) => `<svg viewBox="0 0 40 40" width="${t}" height="${t}" aria-hidden="true">${SOUVENIRS[id]}</svg>`;
  // Étagère « Mes souvenirs » de l'onglet Histoire : un souvenir par quête terminée

  function lanceParcours(x){

  /* ---------- Histoire de Mona : le joueur décide à la place de Mona ---------- */

  function temperament(){

      <header><span class="test">Version de test</span></header>
      <section class="histoire">
        <p class="saison">Ton tempérament : ${esc(t.nom)}</p>
        <div class="bulle-mona">${mona("contente", 64)}<p>${esc(t.mona)}</p></div>
        <p class="note">Ton tempérament reste sur ton téléphone. Il peut changer avec les prochains chapitres.</p>
        ${x ? `<button class="bouton" id="quete">${esc(t.habitant)} : ${esc(x.titre)}</button>` : ""}
        <button class="bouton clair" id="carte">${M.onglet === "histoire" ? "Retour au terrier" : "Retour aux parcours"}</button>
      </section>`;
    if (x) app.querySelector("#quete").onclick = () => { evt("parcours_debut", { parcours: x.id, ecran: "quete" }); lanceParcours(x); };
    app.querySelector("#carte").onclick = retour;
    window.scrollTo(0,0);
  }

  /* ---------- Onglets : Principal (parcours) et Histoire (Terrier de Mona) ---------- */
  function onglets(actif){
    const alerte = actif !== "histoire" && alerteHistoire();
    return `<nav class="onglets" role="tablist" aria-label="Sections">
      <button role="tab" aria-selected="${actif === "principal"}" data-onglet="principal">Principal</button>
      <button role="tab" aria-selected="${actif === "histoire"}" data-onglet="histoire">Histoire${alerte ? `<i class="alerte" aria-label="Mona t'attend"></i>` : ""}</button>
      <button role="tab" aria-selected="${actif === "classement"}" data-onglet="classement">Classement</button>
    </nav>`;
  }
  function brancheOnglets(){
    app.querySelectorAll("[data-onglet]").forEach(b => b.onclick = () => b.dataset.onglet === "histoire" ? terrier() : b.dataset.onglet === "classement" ? ongletClassement() : carte());
  }
  // Retour à l'onglet d'où le joueur est parti
  const retour = () => M.onglet === "histoire" ? terrier() : carte();

  /* ---------- Classement de la semaine : inscription volontaire avec pseudo ---------- */
  // Les noisettes du classement sont calculées par la base (supabase/classement.sql) à partir des leçons :
  // ce ne sont pas celles du terrier, on ne classe jamais sur des rendements.
  async function rpc(nom, corps){
    if (!CFG.SUPABASE_URL || !CFG.SUPABASE_KEY) return null;
    try {
      const r = await fetch(CFG.SUPABASE_URL.replace(/\/$/,"") + "/rest/v1/rpc/" + nom, {
        method:"POST", headers:{ "apikey":CFG.SUPABASE_KEY, "Content-Type":"application/json" }, body: JSON.stringify(corps)
      });
      return r.ok ? await r.json() : null;
    } catch(e){ return null; }
  }
  async function inscription(inscrit){
    const ligne = { visiteur: VISITEUR.id, pseudo: M.pseudo || null, inscrit };
    if (!CFG.SUPABASE_URL || !CFG.SUPABASE_KEY){ console.info("[non envoyé : classement_inscriptions]", ligne); return true; }
    try {
      const r = await fetch(CFG.SUPABASE_URL.replace(/\/$/,"") + "/rest/v1/classement_inscriptions", {
        method:"POST", headers:{ "apikey":CFG.SUPABASE_KEY, "Content-Type":"application/json", "Prefer":"return=minimal" }, body: JSON.stringify(ligne)
      });
      return r.ok;
    } catch(e){ return false; }
  }
  const LIGUES = ["Gland", "Noisette", "Noix", "Châtaigne", "Pomme de pin d'or"];
  async function ongletClassement(){
    abandonEnCours(false);
    etat.parcours = null; // pas mémorisé comme onglet de départ : l'appli rouvre sur Principal ou Histoire
    const regle = `<p class="regle">Les noisettes se récoltent en apprenant&nbsp;: <b>+10</b> par leçon terminée (5 par jour au plus), <b>+2</b> par bonne réponse (une fois par question et par semaine), <b>+5</b> par jour où tu termines une leçon. La ligue et le classement de la semaine repartent de zéro chaque lundi. Elles n'ont aucune valeur en argent.</p>`;
    app.innerHTML = `
      <header><span class="test">Version de test</span></header>
      ${onglets("classement")}
      <section class="classement">
        <h1 style="margin:14px 0 4px">Classement</h1>
        ${regle}
        <div id="contenu-classement"><p class="note">Chargement…</p></div>
      </section>`;
    brancheOnglets();
    // Le pseudo a changé depuis l'inscription : on le met à jour
    if (M.classement && M.pseudo && M.classementPseudo !== M.pseudo && await inscription(true)){ M.classementPseudo = M.pseudo; sauve(); }
    // Pseudo effacé : on retire le joueur du classement
    if (M.classement && !M.pseudo && await inscription(false)){ M.classement = false; M.classementPseudo = null; sauve(); }
    const d = await rpc("classement", { moi: VISITEUR.id });
    const zone = app.querySelector("#contenu-classement");
    if (!zone) return; // le joueur a changé d'onglet pendant le chargement
    if (!d || !d.semaine){ zone.innerHTML = `<p class="note">Le classement n'est pas disponible pour l'instant. Vérifie ta connexion et réessaie plus tard.</p>`; return; }
    const vues = [["semaine", "Semaine"], ["total", "Depuis le début"]];
    if (M.classement && d.ligue) vues.unshift(["ligue", "Ma ligue"]);
    if (!vues.some(([v]) => v === M.vueClassement)) M.vueClassement = vues[0][0];
    const vue = M.vueClassement, moiSem = d.semaine.moi || { noisettes:0 }, moiTot = d.total.moi || { noisettes:0 };
    const ligne = (x, cls) => `<li class="${x.moi ? "moi" : ""} ${cls || ""}"><span class="rang">${x.rang}</span><span>${esc(x.pseudo)}${x.moi ? " (toi)" : ""}</span><span class="score">${nb(x.noisettes)} 🌰</span></li>`;
    const liste = (bloc, vide) => {
      const top = bloc.top || [], m = bloc.moi || {};
      if (!top.length) return `<p class="note">${vide}</p>`;
      return `<ol>${top.map(x => ligne(x)).join("")}</ol>${m.rang && !top.some(x => x.moi) ? `<ol class="hors-top">${ligne({ rang: m.rang, pseudo: M.pseudo || "", noisettes: m.noisettes, moi: true })}</ol>` : ""}`;
    };
    let corps;
    if (vue === "ligue"){
      const L = d.ligue, nom = LIGUES[L.ligue - 1], m = L.membres || [];
      corps = `<p class="titre-ligue">Ligue ${esc(nom)} <span class="note">· ${L.ligue}/5 · ${nb(L.taille)} joueur${L.taille > 1 ? "s" : ""}</span></p>
        <ol>${m.map(x => ligne(x, x.place <= L.monte ? "monte" : x.place > L.taille - L.descend ? "descend" : "")).join("")}</ol>
        <p class="note" style="margin:10px 0 0">${L.monte ? `↑ ${L.monte === 1 ? "Le premier monte" : `Les ${L.monte} premiers montent`} en ligue ${esc(LIGUES[L.ligue])} lundi (avec au moins une noisette). ` : L.ligue === 5 ? "Tu es dans la ligue la plus haute. " : "Il faut au moins 2 joueurs dans le groupe pour monter. "}${L.descend ? `↓ ${L.descend === 1 ? "Le dernier descend" : `Les ${L.descend} derniers descendent`}.` : ""}</p>`;
    } else if (vue === "semaine"){
      corps = liste(d.semaine, "Personne n'a encore récolté de noisettes cette semaine. À toi de commencer&nbsp;!");
    } else {
      corps = liste(d.total, "Pas encore de noisettes récoltées. À toi de commencer&nbsp;!");
    }
    const sousTitre = vue === "total" ? (moiTot.rang ? `depuis le début · ${moiTot.rang}${moiTot.rang === 1 ? "er" : "e"} sur ${nb(d.total.participants)}` : "depuis le début")
      : moiSem.rang ? `cette semaine · ${moiSem.rang}${moiSem.rang === 1 ? "er" : "e"} sur ${nb(d.semaine.participants)}` : "récoltées cette semaine";
    zone.innerHTML = `
      <div class="carte">
        <div class="mon-score">${mona("contente", 56)}<div><b>${nb(vue === "total" ? moiTot.noisettes : moiSem.noisettes)} 🌰</b><br><span class="note">${sousTitre}</span>${
          d.pourcentage !== null && d.pourcentage !== undefined && vue !== "total" ? `<br><span class="pourcentage">Tu fais mieux que ${d.pourcentage} % des joueurs cette semaine</span>` : ""}</div></div>
        <div class="vues" role="tablist" aria-label="Classements">${vues.map(([v, l]) => `<button role="tab" aria-selected="${v === vue}" data-vue="${v}">${l}</button>`).join("")}</div>
        ${corps}
      </div>
      <div class="carte" style="margin-top:14px">
        ${M.classement
          ? `<p style="margin:0 0 10px">Tu apparais dans les classements sous le pseudo <b>${esc(M.pseudo || "")}</b>.</p>
             <button class="bouton clair" id="desinscrire">Ne plus apparaître</button>`
          : M.pseudo
            ? `<p style="margin:0 0 10px">Envie de te mesurer aux autres joueurs et de rejoindre une ligue&nbsp;? Ton pseudo <b>${esc(M.pseudo)}</b> et tes noisettes seront visibles par tous les joueurs. Tu peux te retirer quand tu veux.</p>
               <button class="bouton" id="inscrire">Apparaître dans le classement</button>`
            : `<p style="margin:0 0 10px">Pour apparaître dans les classements et rejoindre une ligue, choisis d'abord un pseudo. Évite ton vrai nom.</p>
               <button class="bouton" id="pseudo">Choisir un pseudo</button>`}
        <p class="erreur cache" id="erreur-classement" style="color:var(--rouge);font-weight:700">L'envoi n'a pas marché. Vérifie ta connexion et réessaie.</p>
      </div>`;
    app.querySelectorAll("[data-vue]").forEach(b => b.onclick = () => { M.vueClassement = b.dataset.vue; sauve(); ongletClassement(); });
    const bascule = async (inscrit, b) => {
      b.disabled = true;
      if (!await inscription(inscrit)){ b.disabled = false; return app.querySelector("#erreur-classement").classList.remove("cache"); }
      M.classement = inscrit; M.classementPseudo = inscrit ? M.pseudo : null;
      if (inscrit) M.vueClassement = "ligue";
      sauve();
      ongletClassement();
    };
    const bi = app.querySelector("#inscrire"); if (bi) bi.onclick = () => bascule(true, bi);
    const bd = app.querySelector("#desinscrire"); if (bd) bd.onclick = () => bascule(false, bd);
    const bp = app.querySelector("#pseudo"); if (bp) bp.onclick = accueil;
  }

  /* ---------- Terrier de Mona : faim liée à la série, cachettes, scènes ---------- */
  // Tout reste sur le téléphone. Les noisettes n'ont aucune valeur en argent.
  let TERRIER = null; // exercices/terrier.json
  const ecart = (a, b) => Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 864e5);
  const prologueJoue = () => !!(M.histoire && M.histoire["cadeau-oncle"]);
  function etatTerrier(){
    if (!M.terrier){ M.terrier = { reserve:0, terrier:(TERRIER ? TERRIER.regles.depart : 1000), chouette:0, panier:0, frais:null, prix:1, saisons:0, scenes:{} }; sauve(); }
    return M.terrier;
  }
  // Jours entiers sans aucune action (le jour de repos de la semaine ne compte pas)
  function joursManques(){
    const der = M.jours[M.jours.length - 1];
    if (!der || serieJours() > 0) return 0;
    return Math.max(0, ecart(der, auj()) - 1);
  }
  // 1er jour manqué : Mona a faim. Dès le 2e : elle mange 10 % de sa réserve d'hiver par jour
  // (dans le terrier si la réserve est vide). Dès le 3e : elle tombe malade jusqu'à la prochaine leçon terminée.
  function appliqueAbsence(){
    const T = M.terrier; if (!T) return;
    const n = joursManques(), der = M.jours[M.jours.length - 1], taux = TERRIER ? TERRIER.regles.perte_absence : 0.1;
    let mange = 0, pioche = 0;
    for (let k = 2; k <= n; k++){
      const d = decale(der, k);
      if (T.puni && d <= T.puni) continue;
      if (T.reserve >= 1){ const m = Math.max(1, Math.round(T.reserve * taux)); T.reserve -= m; mange += m; }
      else if (T.terrier >= 1){ const m = Math.max(1, Math.round(T.terrier * taux)); T.terrier -= m; pioche += m; }
      T.puni = d;
    }
    if (n >= 3) T.malade = true;
    if (mange || pioche){ const a = T.annonce || {}; T.annonce = { mange:(a.mange||0) + mange, pioche:(a.pioche||0) + pioche }; }
    sauve();
  }
  function humeurMona(){
    if (M.terrier && M.terrier.malade) return { h:"malade", jauge:5, txt:"Malade", dit:"Je suis malade… Une leçon complète dans l'onglet Principal me remettrait sur pattes." };
    if (objectifFait()) return { h:"contente", jauge:100, txt:"Rassasiée", dit:"Merci pour le repas ! Je suis en pleine forme." };
    const n = joursManques();
    if (n >= 2) return { h:"faible", jauge:15, txt:"Très faim", dit:"Je n'ai presque plus de forces… J'ai dû piocher dans mes réserves." };
    if (n === 1) return { h:"affamee", jauge:35, txt:"Affamée", dit:"Mon ventre gargouille ! Tu me nourris dans l'onglet Principal ?" };
    return { h:"contente", jauge:65, txt:"Petit creux", dit:"J'ai un petit creux… Mon repas est dans l'onglet Principal !" };
  }
  function prochaineScene(){
    if (!TERRIER) return null;
    const T = etatTerrier();
    for (const c of TERRIER.chapitres){ const s = c.scenes.find(x => !T.scenes[x.id]); if (s) return { c, s }; }
    return null;
  }
  // Chapitre dont toutes les scènes sont jouées mais dont la saison n'est pas encore passée
  const chapitreAFinir = () => TERRIER && M.terrier && TERRIER.chapitres.find(c => c.numero > M.terrier.saisons && c.scenes.every(x => M.terrier.scenes[x.id]));
  const alerteHistoire = () => !!(TERRIER && (!prologueJoue() || chapitreAFinir() || coffreAOuvrir() || prochaineScene()));
  const nb = n => Math.round(n).toLocaleString("fr-FR");

  function cachettes(T, cible){
    const repas = TERRIER ? TERRIER.regles.repas_par_mois : 50, mois = Math.floor(T.reserve / repas);
    const frais = T.frais === "geai" ? CH.fonds_actifs_frais : CH.etf_frais;
    return `<div class="cachettes">
      <div class="carte cachette ${cible === "reserve" ? "cible" : ""}" data-cachette="reserve"><span class="ico">❄️</span><b>${nb(T.reserve)}</b><span>Réserve d'hiver · ${mois} mois de repas</span></div>
      <div class="carte cachette ${cible === "terrier" ? "cible" : ""}" data-cachette="terrier"><span class="ico">🏡</span><b>${nb(T.terrier)}</b><span>Au terrier · au chaud, mais les prix montent</span></div>
      ${T.scenes.chouette
        ? `<div class="carte cachette ${cible === "chouette" ? "cible" : ""}" data-cachette="chouette"><span class="ico">🦉</span><b>${nb(T.chouette)}</b><span>Garde-manger du Hibou · +${nombre(CH.livret_taux.valeur)} % par an</span></div>`
        : `<div class="carte cachette verrou" data-cachette="chouette"><span class="ico">🦉</span><b>Garde-manger</b><span>Rencontre le Hibou au fil de l'histoire</span></div>`}
      ${T.scenes.fourmis
        ? `<div class="carte cachette ${cible === "panier" ? "cible" : ""}" data-cachette="panier"><span class="ico">🧺</span><b>${nb(T.panier)}</b><span>Panier · valeur incertaine${T.frais ? ` · frais ${nombre(frais.valeur)} % par an` : ""}</span></div>`
        : `<div class="carte cachette verrou" data-cachette="panier"><span class="ico">🧺</span><b>Panier</b><span>Rencontre les Fourmis au fil de l'histoire</span></div>`}
      ${T.renard ? `<div class="carte cachette renard ${cible === "renard" ? "cible" : ""}" data-cachette="renard"><span class="ico">🦊</span><b>${nb(T.renard)}</b><span>Chez le renard${T.promis ? ` · promis : ${nb(T.promis)}` : ""}</span></div>` : ""}
      ${T.perdu ? `<div class="carte cachette perdu ${cible === "perdu" ? "cible" : ""}" data-cachette="perdu"><span class="ico">❌</span><b>${nb(T.perdu)}</b><span>Perdu chez le renard</span></div>` : ""}
    </div>`;
  }
  // Noisettes qui volent de Mona vers une cachette
  function voleNoisettes(depuis, vers, n){
    if (!depuis || !vers || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const a = depuis.getBoundingClientRect(), b = vers.getBoundingClientRect();
    for (let k = 0; k < Math.min(n, 8); k++) setTimeout(() => {
      const i = document.createElement("i"); i.className = "vole-noisette";
      i.style.left = (a.left + a.width / 2) + "px"; i.style.top = (a.top + a.height / 2) + "px";
      i.style.setProperty("--x", (b.left + b.width / 2 - a.left - a.width / 2 + (k % 3 - 1) * 12) + "px");
      i.style.setProperty("--y", (b.top + b.height / 2 - a.top - a.height / 2) + "px");
      document.body.appendChild(i); setTimeout(() => i.remove(), 900);
    }, k * 90);
  }
  function brancheMona(phrases){
    const b = app.querySelector("#mona"), bulle = app.querySelector("#bulle"); if (!b) return;
    let k = 0;
    b.onclick = () => {
      b.classList.remove("saute"); void b.offsetWidth; b.classList.add("saute");
      if (bulle){ bulle.textContent = phrases[k++ % phrases.length]; bulle.style.animation = "none"; void bulle.offsetWidth; bulle.style.animation = ""; }
    };
  }

  async function terrier(apres){
    abandonEnCours(false);
    etat.parcours = null;
    M.onglet = "histoire";
    try { TERRIER = TERRIER || await fetch(BASE + "exercices/terrier.json").then(r => r.json()); await chargeQuetes(); }
    catch(err){ M.onglet = "principal"; sauve(); return toast("Impossible de charger le terrier."); }
    const T = etatTerrier(); appliqueAbsence();
    if (!apres) evt("carte", { ecran:"terrier" });
    const hm = humeurMona(), saison = SAISONS[T.saisons % 4], annonce = T.annonce;
    delete T.annonce; sauve();
    const p = prochaineScene(), aFinir = chapitreAFinir(), aOuvrir = coffreAOuvrir();
    let dit = prologueJoue() ? hm.dit : "Mon oncle m'a laissé un drôle de cadeau devant le terrier… Viens voir !";
    let histoire;
    if (!prologueJoue()) histoire = `<button class="carte tuile chapitre" id="prologue"><b>Prologue · Le cadeau de l'oncle</b><span>Le début de l'histoire de Mona</span></button>`;
    else if (aFinir) histoire = `<button class="carte tuile chapitre" id="fin-chapitre"><b>${esc(aFinir.fin.titre)}</b><span>La saison se termine : découvre tes cachettes</span></button>`;
    else if (aOuvrir) histoire = `<button class="carte tuile chapitre coffre-tuile" id="coffre"><b>🎁 Coffre du chapitre ${aOuvrir.numero}</b><span>Ouvre-le pour découvrir ta récompense</span></button>`;
    else if (!p) histoire = `<div class="carte tuile fait"><b>${esc(TERRIER.chapitres[TERRIER.chapitres.length - 1].fin.suite)}</b><span>En attendant, prends soin de Mona</span></div>`;
    else {
      const rang = `Chapitre ${p.c.numero} · ${esc(p.c.saison)} · scène ${p.c.scenes.indexOf(p.s) + 1}/${p.c.scenes.length}`;
      histoire = T.malade ? `<div class="carte tuile fait"><b>${rang}</b><span>Mona est trop faible : soigne-la dans l'onglet Principal</span></div>`
        : `<button class="carte tuile chapitre" id="scene"><b>${esc(p.s.titre)}</b><span>${rang}</span></button>`;
    }
    const pouvoir = T.prix > 1.0001 ? `<p class="note" style="margin:0 0 8px">Les prix ont monté depuis le début : hors panier, tes noisettes achètent autant que <b>${nb((T.reserve + T.terrier + T.chouette) / T.prix)}</b> noisettes du premier printemps.</p>` : "";
    app.innerHTML = `
      <header><span class="test">Version de test</span><span class="espace"></span><span class="points">${NOMS_SAISONS[saison]} · an ${Math.floor(T.saisons / 4) + 1}</span></header>
      ${onglets("histoire")}
      ${decor(saison, `<p class="bulle-scene" id="bulle">${esc(dit)}</p><button class="scene-mona" id="mona" aria-label="Toucher Mona">${mona(hm.h, 120, "noisette")}</button>`)}
      ${annonce ? `<div class="carte annonce">Pendant ton absence, Mona a mangé ${annonce.mange ? `<b>${nb(annonce.mange)}</b> noisettes de sa réserve d'hiver` : ""}${annonce.mange && annonce.pioche ? " et " : ""}${annonce.pioche ? `<b>${nb(annonce.pioche)}</b> noisettes du terrier (sa réserve était vide)` : ""}.</div>` : ""}
      <div class="actions-jour seule">${histoire}</div>
      <h2 class="section-carte" style="margin:6px 0 10px">Mes cachettes</h2>
      ${cachettes(T)}
      ${pouvoir}
      <p class="note" style="margin-top:0">Simulation simplifiée, pas une prévision. Les noisettes n'ont aucune valeur en argent.</p>
      ${garderobe(T)}
      ${souvenirs()}
      ${prologueJoue() ? `<button class="lien-idee" id="prologue">Rejouer le prologue</button>` : ""}`;
    brancheOnglets();
    const phrases = { malade:["Atchoum…", "Une leçon et je me sens mieux, promis."], faible:["J'ai les pattes qui tremblent…", "Une petite question et je reprends des forces !"], affamee:["Grrr… c'est mon ventre, pas moi !", "Une noisette ? Juste une ?"] }[hm.h]
      || ["Hi hi, ça chatouille !", "Tu as vu mes cachettes ?", "Je compte mes noisettes… 1, 2, 3…", "Chaque saison, je recompte mes réserves."];
    brancheMona(phrases);
    const on = (id, f) => { const b = app.querySelector("#" + id); if (b) b.onclick = f; };
    on("prologue", lanceHistoire);
    on("scene", () => lanceScene(p.c, p.s));
    on("fin-chapitre", () => finChapitre(aFinir));
    on("coffre", () => coffre(aOuvrir));
    app.querySelectorAll("[data-tenue]").forEach(b => b.onclick = () => { porte(b.dataset.tenue); terrier({}); });
    window.scrollTo(0,0);
  }

  // Repas : une question au hasard parmi tous les parcours
  async function nourrir(){
    let tous;
    try { tous = await toutesQuestions(); } catch(err){ return toast("Impossible de charger la question."); }
    if (!tous.length) return;
    Object.assign(etat, { mode:"nourrir", parcours:{ id:"terrier", titre:"Repas de Mona" }, lecons:null, lecon:0, EX:[tous[Math.floor(Math.random() * tous.length)]], i:0, points:0, serie:0, justes:0, repondu:true, finRepondue:true });
    evt("parcours_debut", { ecran:"nourrir" });
    exercice();
  }

  /* ---------- Scènes du Terrier : dialogue, choix, conséquence ---------- */
  function ecrit(el, texte){
    let fini = false, id = null;
    const termine = () => { clearInterval(id); el.textContent = texte; fini = true; };

  function lanceScene(c, s){

  // Fin de chapitre : une saison passe (prix et garde-manger, à partir des taux annuels vérifiés)

  /* ---------- Coffres de fin de chapitre : tenues pour Mona ou noisettes ---------- */
  const RARETES = { commun:"Commun", rare:"Rare", epique:"Épique", legendaire:"Légendaire" };

    etat.repondu = false; etat.debut = Date.now();
    app.innerHTML = entete() + `
      <span class="etiquette ${ex.format==="arnaque"?"arnaque":""}">${esc(libelleLecon() ? libelleLecon() + " · " : "")}${ETIQUETTES[ex.format]||""} · ${etat.i+1}/${n}</span>
      <h1 class="question">${esc(remplit(ex.question))}</h1>
      ${ex.indice ? `<details class="indice"><summary>💡 Un indice&nbsp;?</summary><p>${esc(remplit(ex.indice))}</p></details>` : ""}
      <div class="zone" id="zone"></div>
      <div id="retour"></div>`;
    app.querySelector("#quitter").onclick = retour;
    const indice = app.querySelector(".indice");
    if (indice) indice.addEventListener("toggle", () => { if (indice.open && !indice.dataset.vu){ indice.dataset.vu = 1; evt("indice", { ecran: ecranDe(ex) }); } });
    requestAnimationFrame(() => requestAnimationFrame(() => { const b = app.querySelector(".progression i"); if (b) b.style.width = Math.round((etat.i+1)/n*100)+"%"; }));
    const zone = app.querySelector("#zone");
    if (ex.format === "classement") classement(ex, zone); else choix(ex, zone);
    window.scrollTo(0,0);
  }

  function choix(ex, zone){
    const grille = ex.format === "fourchette";
    zone.innerHTML = `<div class="${grille?"grille":""}">` + ex.options.map((o,k) => `<button class="option" data-k="${k}">${esc(remplit(o))}</button>`).join("") + `</div>`;
    zone.querySelectorAll(".option").forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === ex.reponse;
      zone.querySelectorAll(".option").forEach(x => { x.disabled = true; if (+x.dataset.k === ex.reponse) x.classList.add("juste"); });
      if (!ok) b.classList.add("faux","secoue");
      resultat(ex, ok);
    });
  }

  function classement(ex, zone){
    let ordre = ex.elements.map((_,k)=>k);
    do { ordre.sort(() => Math.random() - .5); } while (ordre.every((v,k)=> v === ex.ordre_correct[k]));
    const choisi = [];
    zone.innerHTML = `<p class="note" style="margin-top:0">Touche les éléments dans l'ordre. Touche à nouveau pour retirer.</p>
      ${ordre.map(k => `<button class="option" data-k="${k}"><span class="num"></span>${esc(remplit(ex.elements[k]))}</button>`).join("")}
      <div class="ligne-boutons"><button class="bouton clair" id="raz">Recommencer</button><button class="bouton" id="ok" disabled>Valider</button></div>`;
    const maj = () => {
      zone.querySelectorAll(".option").forEach(b => { const p = choisi.indexOf(+b.dataset.k); b.querySelector(".num").textContent = p >= 0 ? p+1 : ""; });
      zone.querySelector("#ok").disabled = choisi.length !== ex.elements.length;
    };
    zone.querySelectorAll(".option").forEach(b => b.onclick = () => {
      const k = +b.dataset.k, p = choisi.indexOf(k);
      if (p >= 0) choisi.splice(p,1); else choisi.push(k);
      maj();
    });
    zone.querySelector("#raz").onclick = () => { choisi.length = 0; maj(); };
    zone.querySelector("#ok").onclick = () => {
      const ok = choisi.every((v,k) => v === ex.ordre_correct[k]);
      zone.querySelectorAll(".option").forEach(b => {
        b.disabled = true; const k = +b.dataset.k, bonRang = ex.ordre_correct.indexOf(k);
        b.querySelector(".num").textContent = bonRang + 1;
        const tonRang = choisi.indexOf(k);
        b.classList.add(tonRang === bonRang ? "juste" : "faux");
        if (tonRang !== bonRang) b.insertAdjacentHTML("beforeend", `<small class="ton-rang">Tu l'avais mis en ${tonRang + 1}<sup>${tonRang ? "e" : "er"}</sup></small>`);
      });
      zone.querySelector(".note").innerHTML = "<b>Voici le bon classement.</b> En rose : les éléments que tu avais mal placés.";
      ex.ordre_correct.forEach(k => zone.insertBefore(zone.querySelector(`.option[data-k="${k}"]`), zone.querySelector(".ligne-boutons")));
      zone.querySelector(".ligne-boutons").classList.add("cache");
      resultat(ex, ok);
    };
  }

  /* ---------- Résultat, points, série ---------- */
  function resultat(ex, ok){
    if (etat.repondu) return;
    etat.repondu = true;
    enregistre({ ecran: ecranDe(ex), statut:"repondu", juste: ok, temps_ms: Date.now() - etat.debut });
    // Mémorise les erreurs pour la révision ; une bonne réponse en révision les retire,
    // deux échecs en révision aussi (pour ne pas tourner en boucle sur la même question)
    const p = ex._p || etat.parcours.id, cle = e => e.p === p && e.id === ex.id;
    let retiree = false;
    if (!ok && !M.erreurs.some(cle)) M.erreurs.push({ p, id: ex.id });
    if (!ok && etat.mode === "revision"){
      const e = M.erreurs.find(cle); e.echecs = (e.echecs || 0) + 1;
      if (e.echecs >= 2){ M.erreurs = M.erreurs.filter(x => !cle(x)); retiree = true; }
    }
    if (ok && etat.mode === "revision") M.erreurs = M.erreurs.filter(e => !cle(e));
    sauve();
    let gain = 0, bonus = 0;
    if (ok){
      etat.justes++; etat.serie++;
      gain = 10; bonus = etat.serie >= 2 ? 5 * Math.min(etat.serie - 1, 3) : 0;
      etat.points += gain + bonus;
      confettis();
    } else etat.serie = 0;

    const pts = app.querySelector(".points"); if (pts) pts.textContent = etat.points + " pts";
    const se = app.querySelector(".serie"); if (se) se.textContent = etat.serie >= 2 ? `Série de ${etat.serie} 🔥` : "";

    const dernier = etat.i === etat.EX.length - 1;
    const r = app.querySelector("#retour");
    r.innerHTML = `
      <div class="carte retour ${ok?"juste":"faux"}" role="status">
        <div class="titre-retour">${mona(ok ? "contente" : "pensive", 46, ok ? "saut" : "penche")}<h2>${ok ? "Bien joué !" : "Pas tout à fait…"}</h2></div>
        ${ok ? `<p class="gain">+${gain} pts${bonus ? ` · bonus de série +${bonus}` : ""}</p>` : `<p class="note" style="margin:0">${retiree ? "Cette question sort de ta révision : prends le temps de lire l'explication." : etat.mode === "revision" ? "Elle reviendra une dernière fois à la prochaine révision." : "Cette question reviendra dans ta révision."}</p>`}
        <p>${esc(remplit(ok ? ex.retour_juste : ex.retour_faux))}</p>
        <details><summary>En savoir plus</summary><p>${esc(remplit(ex.en_savoir_plus))}</p><p>${sourcesDe(ex)}</p></details>
        <button class="bouton" id="suite">${dernier ? "Voir mon résultat" : "Continuer"}</button>
      </div>`;
    r.scrollIntoView({ behavior:"smooth", block:"nearest" });
    const lu = Date.now();
    r.querySelector("details").addEventListener("toggle", e => { if (e.target.open && !e.target.dataset.vu){ e.target.dataset.vu = 1; evt("en_savoir_plus", { ecran: ecranDe(ex) }); } });
    r.querySelector("#suite").onclick = () => { evt("explication", { ecran: ecranDe(ex), duree_ms: Math.min(Date.now() - lu, 86399999) }); etat.i++; etat.i < etat.EX.length ? exercice() : fin(); };
  }

  function confettis(){
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = document.getElementById("confettis"), couleurs = ["#F4B42A","#FF6A4D","#14808A","#FBF5EA"];
    c.innerHTML = Array.from({length:22}, (_,k) => {
      const a = Math.random()*Math.PI*2, d = 120 + Math.random()*140;
      return `<i style="background:${couleurs[k%4]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d - 60}px;--r:${Math.random()*540-270}deg"></i>`;
    }).join("");
    setTimeout(() => c.innerHTML = "", 1000);
  }

  /* ---------- Fin de leçon, de parcours ou de révision ---------- */
  function badgeParcours(x, taille){
    return `<span class="pastille" style="background:${x.couleur};width:${taille}px;height:${taille}px"><svg viewBox="0 0 30 30" aria-hidden="true" style="width:${taille*.56}px;height:${taille*.56}px">${ICONES[x.icone]||""}</svg></span>`;
  }
  // Fenêtre quand la noisette du jour est gagnée : le nombre de jours dans une grosse noisette
  function noisette(n){
    const t = String(n).length > 2 ? 30 : 40;
    return `<svg viewBox="0 0 120 120" aria-hidden="true">
      <path d="M60 30c-26 0-40 22-40 46 0 22 18 36 40 36s40-14 40-36c0-24-14-46-40-46z" fill="#B07A4A" stroke="#1E2440" stroke-width="4"/>
      <path d="M18 44c4-20 22-32 42-32s38 12 42 32c-12 6-27 8-42 8s-30-2-42-8z" fill="#7A4E2A" stroke="#1E2440" stroke-width="4" stroke-linejoin="round"/>
      <path d="M60 12V3" stroke="#1E2440" stroke-width="5" stroke-linecap="round"/>
      <path d="M32 36q28 8 56 0" stroke="#9A6538" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="60" y="${t > 30 ? 96 : 92}" text-anchor="middle" font-family="Fraunces,serif" font-weight="800" font-size="${t}" fill="#FBF5EA" stroke="#1E2440" stroke-width="1.2">${n}</text>
    </svg>`;
  }
  function popupNoisette(){
    const n = serieJours(), d = document.createElement("div");
    d.className = "popup"; d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true"); d.setAttribute("aria-label", "Noisette du jour");
    d.innerHTML = `<div class="carte popup-carte">${noisette(n)}
      <h2>${n > 1 ? `${n} jours d'affilée&nbsp;!` : "Premier repas&nbsp;!"}</h2>
      <p>${n > 1 ? "Mona a bien mangé aujourd'hui. Reviens demain pour le prochain repas." : "Mona a mangé. Reviens demain pour le prochain repas."}</p>
      <button class="bouton" id="fermer-popup">Super&nbsp;!</button></div>`;
    const ferme = () => d.remove();
    d.onclick = e => { if (e.target === d) ferme(); };
    document.body.appendChild(d);
    const b = d.querySelector("#fermer-popup"); b.onclick = ferme; b.focus();
  }
  function blocObjectif(nouveau){
    const n = serieJours();
    return nouveau
      ? `<div class="carte objectif avec-mona">${mona("contente", 52, "range")}<div><b>🍽️ Mona a mangé&nbsp;!</b><span>Repas : ${n} jour${n>1?"s":""} d'affilée</span></div></div>`
      : `<div class="carte objectif discret"><span>Repas : ${n} jour${n>1?"s":""} d'affilée 🍽️ · repas du jour déjà servi</span></div>`;
  }
  function fin(){
    etat.debut = Date.now();
    const n = etat.EX.length;
    const nouveauJour = !objectifFait();
    if (etat.mode !== "revision" && nouveauJour){ M.jours.push(auj()); M.jours = M.jours.slice(-120); }

    if (etat.mode === "nourrir"){
      enregistre({ ecran:"fin_nourrir", statut:"repondu", juste:null, temps_ms:0, score: etat.points });
      sauve();
      return carte({ repas:true, juste: etat.justes === n, nouveauJour });
    }

    if (etat.mode === "revision"){
      enregistre({ ecran:"fin_revision", statut:"repondu", juste:null, temps_ms:0, score: etat.points });
      sauve();
      app.innerHTML = `
        <header><span class="test">Version de test</span></header>
        <section class="fin">
          <p class="note" style="margin:10px 0 0">Révision</p>
          <p class="score">${etat.justes}/${n}</p>
          <p>${etat.justes === n ? "Toutes tes erreurs sont corrigées. Bravo !" : "Les questions encore ratées reviendront à la prochaine révision."}</p>
          <p class="note">${M.erreurs.length ? `Il reste ${M.erreurs.length} question${M.erreurs.length>1?"s":""} à revoir.` : "Plus aucune question à revoir."}</p>
          <button class="bouton" id="carte" style="margin-top:14px">Retour aux parcours</button>
        </section>`;
      if (etat.justes === n) confettis();
      app.querySelector("#carte").onclick = carte;
      return window.scrollTo(0,0);
    }

    const id = etat.parcours.id, m = M.parcours[id] = M.parcours[id] || {};
    m.lecons = m.lecons || {};
    m.lecons[etat.lecon] = { meilleur: Math.max((m.lecons[etat.lecon]||{}).meilleur || 0, etat.points) };
    const total = etat.lecons.length, toutes = leconsFaites(id) >= total, derniere = etat.lecon === total - 1;
    const dejaFini = !!m.fini; if (toutes) m.fini = true;
    m.meilleur = pointsParcours(id);
    // Une leçon terminée soigne Mona si elle est tombée malade pendant une absence
    const gueri = !!(M.terrier && M.terrier.malade);
    if (gueri) M.terrier.malade = false;
    sauve();
    if (gueri) setTimeout(() => toast("Mona est guérie ! Va la voir dans l'onglet Histoire."), 600);

    if (!derniere){
      enregistre({ ecran:"fin_lecon", statut:"repondu", juste:null, temps_ms:0, score: etat.points });
      app.innerHTML = `
        <header><span class="test">Version de test</span></header>
        <section class="fin">
          <p class="note" style="margin:10px 0 0">${esc(etat.parcours.titre)} · ${esc(libelleLecon())}</p>
          <h2 style="margin-top:10px">Leçon terminée&nbsp;!</h2>
          <p class="score">${etat.points}</p>
          <p style="margin:2px 0 12px">points · ${etat.justes}/${n} bonnes réponses</p>
          ${blocObjectif(nouveauJour)}
          ${inviteQuestionnaire()}
          <p class="note">Les points servent juste à jouer : ils n'ont aucune valeur en argent.</p>
          <button class="bouton" id="suivante" style="margin-top:8px">Leçon suivante : ${esc(etat.lecons[etat.lecon+1].titre)}</button>
          <button class="bouton clair" id="carte" style="margin-top:12px">Retour aux parcours</button>
          <button class="lien-idee" id="idee">💡 Une remarque sur cette leçon&nbsp;?</button>
        </section>`;
      confettis();
      if (nouveauJour) popupNoisette();
      app.querySelector("#suivante").onclick = () => demarreLecon(etat.parcours, etat.lecons, etat.lecon + 1);
      app.querySelector("#carte").onclick = carte;
      const parcoursFini = etat.parcours;
      app.querySelector("#idee").onclick = () => idees("fin_lecon", carte, parcoursFini.id);
      brancheInvite();
      return window.scrollTo(0,0);
    }

    etat.finRepondue = false;
    const nouveauBadge = toutes && !dejaFini;
    app.innerHTML = `
      <header><span class="test">Version de test</span></header>
      <section class="fin">
        <p class="note" style="margin:10px 0 0">${esc(etat.parcours.titre)} · ${esc(libelleLecon())}</p>
        <p class="score">${etat.points}</p>
        <p style="margin:2px 0 0">points · ${etat.justes}/${n} bonnes réponses</p>
        <div class="badge-gagne">${badgeParcours(etat.parcours, 120)}</div>
        <h2>${toutes ? (nouveauBadge ? "Nouveau badge&nbsp;!" : "Badge déjà obtenu") : "Dernière leçon terminée"}</h2>
        <p>${toutes ? `Badge « ${esc(etat.parcours.titre)} » ajouté à ta collection.` : "Termine aussi la leçon précédente pour obtenir le badge."}</p>
        ${toutes && queteDe(etat.parcours.id) ? `<div class="scene-quete">${bulles(queteDe(etat.parcours.id).fin)}</div>
          ${queteDe(etat.parcours.id).objet ? `<p class="souvenir-gagne">${souvenir(queteDe(etat.parcours.id).objet.id, 36)}<span>Souvenir rangé dans le terrier : ${esc(queteDe(etat.parcours.id).objet.nom.replace(/^./, c => c.toLowerCase()))}</span></p>` : ""}` : ""}
        ${blocObjectif(nouveauJour)}
        <p class="note">Les points servent juste à jouer : ils n'ont aucune valeur en argent.</p>
        <div class="suite carte">
          <p class="titre" style="font-size:22px;margin-bottom:12px">Envie de la suite&nbsp;?</p>
          <div class="ligne-boutons" id="suite">
            <button class="bouton" data-r="oui">Oui&nbsp;!</button>
            <button class="bouton clair" data-r="peut-etre">Peut-être</button>
            <button class="bouton clair" data-r="non">Non merci</button>
          </div>
          <p class="merci cache" id="merci">Merci, c'est noté&nbsp;!</p>
        </div>
        ${inviteQuestionnaire()}
        <button class="bouton clair" id="carte" style="margin-top:14px">Retour aux parcours</button>
        <button class="lien-idee" id="idee">💡 Une idée pour améliorer ce parcours&nbsp;?</button>
      </section>`;
    confettis();
    if (nouveauJour) popupNoisette();
    const parcoursFini = etat.parcours;
    app.querySelector("#idee").onclick = () => idees("fin", carte, parcoursFini.id);
    brancheInvite();
    app.querySelectorAll("#suite button").forEach(bt => bt.onclick = () => {
      if (etat.finRepondue) return;
      etat.finRepondue = true;
      enregistre({ ecran:"fin", statut:"repondu", juste:null, temps_ms: Date.now()-etat.debut, reponse: bt.dataset.r, score: etat.points });
      app.querySelector("#suite").classList.add("cache");
      app.querySelector("#merci").classList.remove("cache");
    });
    app.querySelector("#carte").onclick = carte;
    window.scrollTo(0,0);
  }

  /* ---------- Questionnaire de retours : proposé en fin de leçon à partir du 2e jour de jeu ---------- */
  const QUESTIONS = [
    { id:"deception", q:"Comment te sentirais-tu si tu ne pouvais plus utiliser Cap Invest ?", r:[["tres","Très déçu·e"],["un_peu","Un peu déçu·e"],["pas","Pas déçu·e"],["plus","Je ne l'utilise déjà plus"]] },
    { id:"experience", q:"Avant Cap Invest, tu avais déjà investi ?", r:[["jamais","Jamais"],["un_peu","Un peu"],["regulier","Régulièrement"]] },
    { id:"niveau", q:"Le niveau des questions était…", r:[["facile","Trop facile"],["adapte","Adapté"],["difficile","Trop difficile"]] },
    { id:"motivation", q:"Qu'est-ce qui t'a le plus motivé·e à continuer ?", r:[["points","Les points"],["serie","La série de jours"],["badges","Les badges"],["mona","Mona et son histoire"],["repas","Nourrir Mona chaque jour"],["contenu","Rien de tout ça, c'est le contenu"]] },
    { id:"rappel", q:"Aimerais-tu un rappel pour garder ta série ?", r:[["quotidien","Oui, chaque jour"],["parfois","Oui, mais pas tous les jours"],["non","Non"]] },
    { id:"sujet", q:"Quel sujet aimerais-tu découvrir ensuite ?", r:[["budget","Budget et épargne"],["assurance_vie","Assurance vie"],["credit","Crédit et taux d'intérêt"],["marches","Ce qui fait bouger les marchés"],["autre","Autre"]] }
  ];
  // Proposé tant qu'il n'est pas rempli : au plus une fois par jour, trois jours différents en tout
  const questionnaireAProposer = () => !M.questionnaire && new Set(M.jours).size >= 2 && M.questionnaireVu !== auj() && (M.questionnaireReports || 0) < 3;
  function inviteQuestionnaire(){
    if (!questionnaireAProposer()) return "";
    return `<div class="carte invite-q" id="invite-q">
      <div class="bulle-mona">${mona("contente", 56)}<p><b>1 minute pour nous aider&nbsp;?</b> 7 questions sur ton expérience. Les réponses honnêtes, même négatives, nous aident le plus.</p></div>
      <div class="ligne-boutons"><button class="bouton" id="q-oui">Répondre</button><button class="bouton clair" id="q-tard">Plus tard</button></div>
    </div>`;
  }
  function brancheInvite(){
    const oui = app.querySelector("#q-oui");
    if (!oui) return;
    M.questionnaireVu = auj(); M.questionnaireReports = (M.questionnaireReports || 0) + 1; sauve();
    oui.onclick = () => questionnaire(carte);
    app.querySelector("#q-tard").onclick = () => app.querySelector("#invite-q").remove();
  }
  function questionnaire(retour){
    etat.parcours = null;
    const rep = {};
    app.innerHTML = `
      <header><button class="retour-carte" id="retour" aria-label="Retour">←</button><span class="espace"></span><span class="test">Version de test</span></header>
      <section class="idees questionnaire">
        <h1>Ton avis</h1>
        <p class="note">Moins d'une minute. Lu seulement par l'équipe du test${M.pseudo ? `, avec ton pseudo (${esc(M.pseudo)})` : ""}.</p>
        ${QUESTIONS.map((x, i) => `<fieldset><legend>${i+1}. ${esc(x.q)}</legend><div class="choix-liste">${x.r.map(([v, l]) =>
          `<button type="button" class="choix" aria-pressed="false" data-q="${x.id}" data-v="${v}">${esc(l)}</button>`).join("")}</div></fieldset>`).join("")}
        <fieldset><legend><label for="retenu">7. Si tu devais retenir une chose de Cap Invest, ce serait quoi&nbsp;? <span class="note">(facultatif)</span></label></legend>
          <textarea id="retenu" maxlength="1000" placeholder="Une notion, un moment, une impression…"></textarea></fieldset>
        <p class="note">N'écris pas d'informations personnelles (nom, téléphone, situation financière).</p>
        <p class="erreur cache" id="erreur">L'envoi n'a pas marché. Vérifie ta connexion et réessaie : tes réponses sont gardées.</p>
        <button class="bouton" id="envoyer" disabled>Réponds aux 6 premières questions</button>
      </section>`;
    const bt = app.querySelector("#envoyer");
    const maj = () => {
      const n = QUESTIONS.filter(x => rep[x.id]).length;
      bt.disabled = n < QUESTIONS.length;
      bt.textContent = bt.disabled ? `Réponds aux 6 premières questions (${n}/6)` : "Envoyer";
    };
    app.querySelectorAll(".choix").forEach(b => b.onclick = () => {
      app.querySelectorAll(`.choix[data-q="${b.dataset.q}"]`).forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true"); rep[b.dataset.q] = b.dataset.v; maj();
    });
    maj();
    app.querySelector("#retour").onclick = retour;
    bt.onclick = async () => {
      bt.disabled = true; bt.textContent = "Envoi…";
      app.querySelector("#erreur").classList.add("cache");
      const retenu = app.querySelector("#retenu").value.trim().slice(0, 1000);
      const ligne = Object.assign({ visiteur: VISITEUR.id, session: etat.session, version: CFG.VERSION || "test", pseudo: M.pseudo || null, retenu: retenu || null }, rep);
      let ok = false;
      if (!CFG.SUPABASE_URL || !CFG.SUPABASE_KEY){ console.info("[non envoyé : questionnaire]", ligne); ok = true; }
      else try {
        const r = await fetch(CFG.SUPABASE_URL.replace(/\/$/,"") + "/rest/v1/questionnaire", {
          method:"POST", headers:{ "apikey":CFG.SUPABASE_KEY, "Content-Type":"application/json", "Prefer":"return=minimal" }, body: JSON.stringify(ligne)
        });
        ok = r.ok;
      } catch(e){}
      if (!ok){ maj(); return app.querySelector("#erreur").classList.remove("cache"); }
      M.questionnaire = "fait"; sauve();
      app.querySelector(".questionnaire").innerHTML = `
        <div class="bulle-mona" style="margin-top:24px">${mona("contente", 72)}<p><b>Merci&nbsp;!</b> Tes réponses sont bien reçues. Elles vont guider les prochaines versions de l'appli.</p></div>
        <button class="bouton" id="fini" style="margin-top:14px">Retour aux parcours</button>`;
      app.querySelector("#fini").onclick = retour;
      window.scrollTo(0,0);
    };
    window.scrollTo(0,0);
  }

  /* ---------- Boîte à idées : texte libre envoyé à l'organisateur du test ---------- */
  function idees(origine, retour, parcours){
    etat.parcours = null;
    app.innerHTML = `
      <header><button class="retour-carte" id="retour" aria-label="Retour">←</button><span class="espace"></span><span class="test">Version de test</span></header>
      <section class="idees">
        <h1>Une idée&nbsp;?</h1>
        <div class="bulle-mona">${mona("contente", 64)}<p>Un truc pas clair, un bug, une envie, un avis… Écris comme ça vient, même en vrac&nbsp;: tout est lu.</p></div>
        <textarea id="texte-idee" aria-label="Ta suggestion" maxlength="2000" placeholder="Ex. : la question sur le PEA est trop longue, j'aimerais un parcours sur l'immobilier, le bouton est dur à toucher…">${esc(M.idee || "")}</textarea>
        <p class="compteur" id="compteur"></p>
        <p class="note">Lu seulement par l'organisateur du test${M.pseudo ? `, avec ton pseudo (${esc(M.pseudo)})` : ""}. N'écris pas d'informations personnelles (nom, téléphone, situation financière).</p>
        <p class="erreur cache" id="erreur">L'envoi n'a pas marché. Vérifie ta connexion et réessaie : ton texte est gardé.</p>
        <button class="bouton" id="envoyer" disabled>Envoyer</button>
      </section>`;
    const zone = app.querySelector("#texte-idee"), bt = app.querySelector("#envoyer"), cpt = app.querySelector("#compteur");
    const majZone = () => { bt.disabled = !zone.value.trim(); cpt.textContent = zone.value.length > 1500 ? `${zone.value.length} / 2000` : ""; };
    zone.oninput = () => { M.idee = zone.value; sauve(); majZone(); };
    majZone();
    app.querySelector("#retour").onclick = retour;
    bt.onclick = async () => {
      const texte = zone.value.trim().slice(0, 2000);
      if (!texte) return;
      bt.disabled = true; bt.textContent = "Envoi…";
      app.querySelector("#erreur").classList.add("cache");
      const ligne = { visiteur: VISITEUR.id, session: etat.session, version: CFG.VERSION || "test", pseudo: M.pseudo || null, parcours: parcours || null, origine, texte };
      let ok = false;
      if (!CFG.SUPABASE_URL || !CFG.SUPABASE_KEY){ console.info("[non envoyé : suggestions]", ligne); ok = true; }
      else try {
        const r = await fetch(CFG.SUPABASE_URL.replace(/\/$/,"") + "/rest/v1/suggestions", {
          method:"POST", headers:{ "apikey":CFG.SUPABASE_KEY, "Content-Type":"application/json", "Prefer":"return=minimal" }, body: JSON.stringify(ligne)
        });
        ok = r.ok;
      } catch(e){}
      if (!ok){ bt.disabled = false; bt.textContent = "Envoyer"; return app.querySelector("#erreur").classList.remove("cache"); }
      M.idee = ""; sauve();
      app.querySelector(".idees").innerHTML = `
        <div class="bulle-mona" style="margin-top:24px">${mona("contente", 72)}<p><b>Merci&nbsp;!</b> C'est bien reçu. Chaque remarque aide à rendre l'appli plus claire.</p></div>
        <button class="bouton" id="encore" style="margin-top:14px">Ajouter autre chose</button>
        <button class="bouton clair" id="fini" style="margin-top:12px">Retour</button>`;
      app.querySelector("#encore").onclick = () => idees(origine, retour, parcours);
      app.querySelector("#fini").onclick = retour;
    };
    window.scrollTo(0,0);
  }

  /* ---------- Code d'accès (barrière légère pour la version de test) ---------- */
  async function empreinte(txt){
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
  }
  function codeAcces(suite){
    if (!CFG.CODE_ACCES_SHA256 || M.acces === CFG.CODE_ACCES_SHA256) return suite();
    app.innerHTML = `
      <header><span class="test">Version de test</span></header>
      <section class="accueil">
        <h1>Cap Invest</h1>
        <p class="chapo">Version de test réservée. Entre le code qu'on t'a donné.</p>
        <p class="note">Pas de compte. Des statistiques d'usage anonymes sont mesurées pour améliorer l'appli.</p>
        <form id="f" class="carte">
          <label for="code" style="font-weight:700">Code d'accès</label>
          <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" style="display:block;width:100%;margin:8px 0 12px;padding:14px;font:inherit;font-size:20px;letter-spacing:.08em;border:2px solid var(--encre);border-radius:12px;background:var(--papier);color:var(--encre)">
          <button class="bouton">Entrer</button>
          <p id="err" class="note cache" style="color:var(--rouge);font-weight:700;margin-bottom:0">Ce n'est pas le bon code.</p>
        </form>
      </section>`;
    const f = app.querySelector("#f");
    f.onsubmit = async e => {
      e.preventDefault();
      const h = await empreinte(f.code.value.trim().toUpperCase());
      if (h === CFG.CODE_ACCES_SHA256){ M.acces = h; sauve(); evt("code_ok"); suite(); }
      else { app.querySelector("#err").classList.remove("cache"); f.classList.add("secoue"); setTimeout(() => f.classList.remove("secoue"), 400); }
    };
    app.querySelector("#code").focus();
  }

  /* ---------- Démarrage ---------- */
  evt("visite", Object.assign({ nouveau: VISITEUR.nouveau, appareil: matchMedia("(pointer: coarse)").matches ? "mobile" : "ordinateur", installe: !!installee() }, M.source ? { source: M.source } : {}));
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("../sw.js", { scope:"../" }).catch(()=>{});
  Promise.all([
    fetch(BASE + "exercices/parcours.json").then(r => r.json()),
    fetch(BASE + "donnees/chiffres.json").then(r => r.json()),
    fetch(BASE + "exercices/terrier.json").then(r => r.json()).catch(() => null)
  ]).then(([p, c, t]) => { PARCOURS = p.parcours; CH = c; TERRIER = t; appliqueAbsence(); codeAcces(() => M.perso ? retour() : accueil()); })
    .catch(e => { app.innerHTML = "<p>Impossible de charger l'application. Vérifie ta connexion.</p>"; console.error(e); });
})();
</script>
</body>
</html>
